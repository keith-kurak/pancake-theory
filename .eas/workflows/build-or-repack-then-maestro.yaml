name: Build or Repack, then Maestro

jobs:
  fingerprint:
    # The e2e profiles extend production, so this needs the production
    # environment for ANDROID_MINIFY. Nothing else: the e2e profiles are
    # fingerprint-identical to production by design.
    environment: production
    type: fingerprint

  android_get_build:
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      platform: android
      profile: e2e-apk

  android_repack:
    needs: [android_get_build]
    if: ${{ needs.android_get_build.outputs.build_id }}
    type: repack
    env:
      METRICS_ENV: e2e
    params:
      build_id: ${{ needs.android_get_build.outputs.build_id }}

  android_build:
    needs: [android_get_build]
    if: ${{ !needs.android_get_build.outputs.build_id }}
    type: build
    env:
      METRICS_ENV: e2e
    params:
      platform: android
      profile: e2e-apk

  android_maestro:
    after: [android_repack, android_build]
    type: maestro
    image: latest
    params:
      build_id: ${{ needs.android_repack.outputs.build_id || needs.android_build.outputs.build_id }}
      device_identifier: pixel_8_pro
      flow_path:
        [".maestro/preview-smoke.yaml", ".maestro/make-fluffy-pancakes.yaml"]
      record_screen: true
  ios_get_build:
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      platform: ios
      profile: e2e-simulator

  ios_repack:
    needs: [ios_get_build]
    if: ${{ needs.ios_get_build.outputs.build_id }}
    type: repack
    env:
      METRICS_ENV: e2e
    params:
      build_id: ${{ needs.ios_get_build.outputs.build_id }}

  ios_build:
    needs: [ios_get_build]
    if: ${{ !needs.ios_get_build.outputs.build_id }}
    type: build
    env:
      METRICS_ENV: e2e
    params:
      platform: ios
      profile: e2e-simulator

  ios_maestro:
    after: [ios_repack, ios_build]
    type: maestro
    image: latest
    params:
      build_id: ${{ needs.ios_repack.outputs.build_id || needs.ios_build.outputs.build_id }}
      device_identifier: iPhone 18 Pro Max
      flow_path:
        [".maestro/preview-smoke.yaml", ".maestro/make-fluffy-pancakes.yaml"]
      record_screen: true
