name: Continuous deploy to production on main

# Continuous deployment for the production iOS app.
#
# Two things decide what happens on a push to main:
#
#   1. Is there a GitHub release whose tag matches the current runtime version?
#      GitHub carries two independent flags, `draft` and `prerelease`. Either
#      one means the version is still being assembled, so the store build is not
#      live yet and may be replaced. Only a release with neither flag is live,
#      and then the only safe change is an over-the-air update.
#   2. Does main still fingerprint-match the production iOS store build for that
#      same runtime version? If not, the native layer changed and neither a
#      repack nor an update can carry the change.
#
#   fingerprint match + pre-release  -> repack the store build, resubmit
#   fingerprint match + full release -> publish an EAS Update to production
#   NO match          + pre-release  -> build iOS and submit: the first build of
#                                       a version whose release already exists
#   anything else                    -> explain the problem and fail
#
# Uses the existing GH_TOKEN secret in the "production" EAS environment, which
# needs read access to this repository's releases. The lookup itself lives in
# .eas/functions/find-github-release, shared with
# promote-release-on-distribution.yaml.

on:
  push:
    branches: [main]
    # Docs, and anything under a dot-folder (.eas, .github, .vscode, .claude,
    # .maestro), cannot change what ships, so they should not spend a run or
    # move the production app. "**" is the base include; the "!" patterns carve
    # out of it.
    paths:
      - "**"
      - "!**/*.md"
      - "!.*/**"
      - "!**/.*/**"
  # Kept so the gating logic can be exercised without pushing to main.
  workflow_dispatch: {}

concurrency:
  cancel_in_progress: false
  group: ${{ workflow.filename }}-${{ github.ref }}

defaults:
  tools:
    bun: 1.3.10

jobs:
  # Resolves the runtime version from the project, then asks GitHub whether a
  # release is tagged for it. Both answers come from one job so the workflow
  # spends a single VM on them.
  release_state:
    name: Resolve runtime version and release state
    environment: production
    outputs:
      runtime_version: ${{ steps.resolve.outputs.runtime_version }}
      release_state: ${{ steps.release.outputs.state }}
      release_url: ${{ steps.release.outputs.url }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules

      - id: resolve
        uses: ./.eas/functions/resolve-runtime-version

      - id: release
        uses: ./.eas/functions/find-github-release
        with:
          runtime_version: ${{ steps.resolve.outputs.runtime_version }}

  fingerprint:
    name: Fingerprint main
    environment: production
    type: fingerprint

  # Looks for the production iOS store build that this commit could be layered
  # on top of. An empty build_id is the "native layer changed" signal every
  # downstream job branches on.
  ios_get_build:
    name: Find matching iOS store build
    needs: [fingerprint, release_state]
    type: get-build
    params:
      platform: ios
      profile: production
      distribution: store
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      runtime_version: ${{ needs.release_state.outputs.runtime_version }}

  # --- Path 1: pre-release, so the store build can still be replaced. ---------

  ios_repack:
    name: Repack iOS build for pre-release
    needs: [ios_get_build, release_state]
    if: ${{ needs.ios_get_build.outputs.build_id && needs.release_state.outputs.release_state == 'prerelease' }}
    type: repack
    params:
      build_id: ${{ needs.ios_get_build.outputs.build_id }}
      profile: production
      message: Repack of ${{ github.sha }} for runtime ${{ needs.release_state.outputs.runtime_version }}

  submit_ios:
    name: Submit repacked build to TestFlight
    needs: [ios_repack]
    type: submit
    params:
      build_id: ${{ needs.ios_repack.outputs.build_id }}
      profile: production

  # --- Path 3: pre-release with nothing to repack onto, so build it. ----------
  # (numbered after the two lanes above because it is the rarer first-build case)

  # A release is tagged for this runtime version but no production store build
  # matches it yet. That is the first merge after an app version bump: there is
  # nothing to repack onto, so the build has to be made, then submitted so it
  # reaches TestFlight. Subsequent merges find this build and go back to
  # repacking and resubmitting it.
  ios_first_build:
    name: Build iOS for pre-release
    needs: [ios_get_build, release_state]
    if: ${{ !needs.ios_get_build.outputs.build_id && needs.release_state.outputs.release_state == 'prerelease' }}
    type: build
    params:
      platform: ios
      profile: production
      message: First build for runtime ${{ needs.release_state.outputs.runtime_version }} (${{ github.sha }})

  # Same destination as the repack lane: App Store Connect, which is what puts
  # the build in front of TestFlight testers. Without this the first build of a
  # version would sit in EAS until some later merge repacked and submitted it.
  submit_ios_first_build:
    name: Submit full build to TestFlight
    needs: [ios_first_build]
    type: submit
    params:
      build_id: ${{ needs.ios_first_build.outputs.build_id }}
      profile: production

  # --- Path 2: full release, so only an update can reach users. ---------------

  publish_update:
    name: Publish update to production
    needs: [ios_get_build, release_state]
    if: ${{ needs.ios_get_build.outputs.build_id && needs.release_state.outputs.release_state == 'released' }}
    environment: production
    type: update
    params:
      platform: ios
      channel: production
      message: ${{ github.commit_message || github.sha }}

  # --- Path 4: nothing can ship. Say why, then fail. -------------------------

  doc_fingerprint_mismatch:
    name: Explain fingerprint mismatch
    needs: [ios_get_build, release_state]
    if: ${{ !needs.ios_get_build.outputs.build_id && needs.release_state.outputs.release_state == 'released' }}
    type: doc
    params:
      md: |
        # This merge does not match the production app

        Runtime version **${{ needs.release_state.outputs.runtime_version }}** is already
        released, but no production iOS store build matches the fingerprint of `main` at
        commit `${{ github.sha }}`.

        The native layer changed. The released version cannot have its binary replaced, and
        this merge cannot be delivered to it as an update. **Revise the merge.**

        Common causes:

        1. A dependency with native code was added, removed, or upgraded.
        2. A config plugin, or a value a config plugin reads, changed.
        3. Something in **app.json** that affects the native project changed.

        To ship it anyway, bump the app version and run a new production build. That
        starts a new runtime version, which needs its own release.

        Release: ${{ needs.release_state.outputs.release_url }}

  doc_no_release:
    name: Explain missing release
    needs: [ios_get_build, release_state]
    if: ${{ !needs.ios_get_build.outputs.build_id && needs.release_state.outputs.release_state == 'none' }}
    type: doc
    params:
      md: |
        # No release exists for this runtime version

        No GitHub release is tagged `${{ needs.release_state.outputs.runtime_version }}`
        (or `v${{ needs.release_state.outputs.runtime_version }}`), and no production iOS
        store build matches this runtime version and fingerprint.

        The runtime version — which follows the app version's major and minor — has
        changed, and nothing tells this workflow what the new version is for. **Create the
        release and the next merge builds it.**

        1. Create a GitHub release tagged `${{ needs.release_state.outputs.runtime_version }}`,
           marked **draft or pre-release**.
        2. Push to `main` again. With a pre-release and no matching build, this workflow
           builds iOS and submits it to App Store Connect for TestFlight. Later merges
           repack and resubmit that build.
        3. Clear both release flags once the version is live, so later merges publish
           over-the-air updates instead.

  doc_release_missing_for_match:
    name: Explain missing release for matching build
    needs: [ios_get_build, release_state]
    if: ${{ needs.ios_get_build.outputs.build_id && needs.release_state.outputs.release_state == 'none' }}
    type: doc
    params:
      md: |
        # Fingerprint matches, but no release says what to do with it

        `main` at commit `${{ github.sha }}` matches production iOS store build
        `${{ needs.ios_get_build.outputs.build_id }}` for runtime version
        **${{ needs.release_state.outputs.runtime_version }}**, but no GitHub release is
        tagged for that version.

        The release's state is what decides between repacking the store build and
        publishing an update, so there is nothing to decide from. Create a GitHub release
        tagged `${{ needs.release_state.outputs.runtime_version }}`:

        - **Draft or pre-release** while the version is still being assembled — merges
          repack and resubmit.
        - **Full release** (neither flag) once the version is live — merges publish an
          update to production.

  fail_workflow:
    name: Fail
    needs: [ios_get_build, release_state]
    after:
      [doc_fingerprint_mismatch, doc_no_release, doc_release_missing_for_match]
    # Everything except the three lanes that ship: repack, update, and the first
    # build of a new pre-release.
    if: ${{ needs.release_state.outputs.release_state == 'none' || (!needs.ios_get_build.outputs.build_id && needs.release_state.outputs.release_state == 'released') }}
    steps:
      - name: Fail the run
        run: |
          echo "Nothing can ship from this merge. See the note above for what to do."
          exit 1
