name: Continuous deploy to production on main

# Continuous deployment for the production iOS and Android apps.
#
# Two things decide what happens on a push to main:
#
#   1. Is there a GitHub release whose tag matches the current runtime version?
#      GitHub carries two independent flags, `draft` and `prerelease`. Either
#      one means the version is still being assembled, so the store build is not
#      live yet and may be replaced. Only a release with neither flag is live,
#      and then the only safe change is an over-the-air update.
#   2. Does main still fingerprint-match the production store builds for that
#      same runtime version, on BOTH platforms? If either one fails to match,
#      the native layer changed and neither a repack nor an update can carry the
#      change. Both platforms are decided together, so one store never moves
#      without the other.
#
#   both match + pre-release  -> iOS: repack the store build, resubmit
#                                Android: build and submit (see below)
#   both match + full release -> publish an EAS Update to production
#   NOT both   + pre-release  -> build both and submit: the first build of a
#                                version whose release already exists
#   anything else             -> explain the problem and fail
#
# Android production builds are app bundles (.aab), which repack cannot
# process. So on a pre-release, Android always gets a full build.
#
# Uses the existing GH_TOKEN secret in the "production" EAS environment, which
# needs read access to this repository's releases. The lookup itself lives in
# .eas/functions/find-github-release, shared with
# promote-release-on-distribution.yaml.

on:
  push:
    branches: [main]
    # Docs, and anything under a dot-folder (.eas, .github, .vscode, .claude,
    # .maestro), cannot change what ships, so they should not spend a run or
    # move the production app. "**" is the base include; the "!" patterns carve
    # out of it.
    paths:
      - "**"
      - "!**/*.md"
      - "!.*/**"
      - "!**/.*/**"
  # Kept so the gating logic can be exercised without pushing to main.
  workflow_dispatch: {}

concurrency:
  cancel_in_progress: false
  group: ${{ workflow.filename }}-${{ github.ref }}

defaults:
  tools:
    bun: 1.3.10

jobs:
  # Resolves the runtime version from the project, then asks GitHub whether a
  # release is tagged for it. Both answers come from one job so the workflow
  # spends a single VM on them.
  release_state:
    name: Resolve runtime version and release state
    environment: production
    outputs:
      runtime_version: ${{ steps.resolve.outputs.runtime_version }}
      release_state: ${{ steps.release.outputs.state }}
      release_url: ${{ steps.release.outputs.url }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules

      - id: resolve
        uses: ./.eas/functions/resolve-runtime-version

      - id: release
        uses: ./.eas/functions/find-github-release
        with:
          runtime_version: ${{ steps.resolve.outputs.runtime_version }}

  fingerprint:
    name: Fingerprint main
    environment: production
    type: fingerprint

  # Look for the production store builds that this commit could be layered on
  # top of. An empty build_id on EITHER platform is the "native layer changed"
  # signal every downstream job branches on.
  ios_get_build:
    name: Find matching iOS store build
    needs: [fingerprint, release_state]
    type: get-build
    params:
      platform: ios
      profile: production
      distribution: store
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      runtime_version: ${{ needs.release_state.outputs.runtime_version }}

  android_get_build:
    name: Find matching Android store build
    needs: [fingerprint, release_state]
    type: get-build
    params:
      platform: android
      profile: production
      distribution: store
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      runtime_version: ${{ needs.release_state.outputs.runtime_version }}

  # --- Path 1: pre-release, so the store builds can still be replaced. --------

  ios_repack:
    name: Repack iOS build for pre-release
    needs: [ios_get_build, android_get_build, release_state]
    if: ${{ needs.ios_get_build.outputs.build_id && needs.android_get_build.outputs.build_id && needs.release_state.outputs.release_state == 'prerelease' }}
    type: repack
    params:
      build_id: ${{ needs.ios_get_build.outputs.build_id }}
      profile: production
      message: Repack of ${{ github.sha }} for runtime ${{ needs.release_state.outputs.runtime_version }}

  submit_ios:
    name: Submit repacked build to TestFlight
    needs: [ios_repack]
    type: submit
    params:
      build_id: ${{ needs.ios_repack.outputs.build_id }}
      profile: production

  # Repack cannot process an .aab, so every pre-release merge builds Android in
  # full, whether or not a matching build exists. It still waits on both
  # get-build jobs, so nothing starts until both platforms are known.
  android_build:
    name: Build Android for pre-release
    needs: [ios_get_build, android_get_build, release_state]
    if: ${{ needs.release_state.outputs.release_state == 'prerelease' }}
    type: build
    params:
      platform: android
      profile: production
      message: Build of ${{ github.sha }} for runtime ${{ needs.release_state.outputs.runtime_version }}

  submit_android:
    name: Submit Android build to Google Play
    needs: [android_build]
    type: submit
    params:
      build_id: ${{ needs.android_build.outputs.build_id }}
      profile: production

  # --- Path 3: pre-release with nothing to repack onto, so build it. ----------
  # (numbered after the two lanes above because it is the rarer first-build case)

  # A release is tagged for this runtime version but the production store
  # builds do not both match it yet. That is the first merge after an app
  # version bump: there is nothing to repack onto, so the iOS build has to be
  # made, then submitted so it reaches TestFlight. Android is already covered by
  # android_build above. Subsequent merges find this build and go back to
  # repacking and resubmitting it.
  ios_first_build:
    name: Build iOS for pre-release
    needs: [ios_get_build, android_get_build, release_state]
    if: ${{ !(needs.ios_get_build.outputs.build_id && needs.android_get_build.outputs.build_id) && needs.release_state.outputs.release_state == 'prerelease' }}
    type: build
    params:
      platform: ios
      profile: production
      message: First build for runtime ${{ needs.release_state.outputs.runtime_version }} (${{ github.sha }})

  # Same destination as the repack lane: App Store Connect, which is what puts
  # the build in front of TestFlight testers. Without this the first build of a
  # version would sit in EAS until some later merge repacked and submitted it.
  submit_ios_first_build:
    name: Submit full build to TestFlight
    needs: [ios_first_build]
    type: submit
    params:
      build_id: ${{ needs.ios_first_build.outputs.build_id }}
      profile: production

  # --- Path 2: full release, so only an update can reach users. ---------------

  publish_update:
    name: Publish update to production
    needs: [ios_get_build, android_get_build, release_state]
    if: ${{ needs.ios_get_build.outputs.build_id && needs.android_get_build.outputs.build_id && needs.release_state.outputs.release_state == 'released' }}
    environment: production
    type: update
    params:
      platform: all
      channel: production
      message: ${{ github.commit_message || github.sha }}

  # --- Path 4: nothing can ship. Say why, then fail. -------------------------

  doc_fingerprint_mismatch:
    name: Explain fingerprint mismatch
    needs: [ios_get_build, android_get_build, release_state]
    if: ${{ !(needs.ios_get_build.outputs.build_id && needs.android_get_build.outputs.build_id) && needs.release_state.outputs.release_state == 'released' }}
    type: doc
    params:
      md: |
        # This merge does not match the production app

        Runtime version **${{ needs.release_state.outputs.runtime_version }}** is already
        released, but `main` at commit `${{ github.sha }}` does not fingerprint-match a
        production store build on both platforms:

        - iOS: `${{ needs.ios_get_build.outputs.build_id || 'no match' }}`
        - Android: `${{ needs.android_get_build.outputs.build_id || 'no match' }}`

        The native layer changed. The released version cannot have its binary replaced, and
        this merge cannot be delivered to it as an update. **Revise the merge.**

        Common causes:

        1. A dependency with native code was added, removed, or upgraded.
        2. A config plugin, or a value a config plugin reads, changed.
        3. Something in **app.json** that affects the native project changed.

        To ship it anyway, bump the app version and run a new production build. That
        starts a new runtime version, which needs its own release.

        Release: ${{ needs.release_state.outputs.release_url }}

  doc_no_release:
    name: Explain missing release
    needs: [ios_get_build, android_get_build, release_state]
    if: ${{ !(needs.ios_get_build.outputs.build_id && needs.android_get_build.outputs.build_id) && needs.release_state.outputs.release_state == 'none' }}
    type: doc
    params:
      md: |
        # No release exists for this runtime version

        No GitHub release is tagged `${{ needs.release_state.outputs.runtime_version }}`
        (or `v${{ needs.release_state.outputs.runtime_version }}`), and the production store
        builds do not both match this runtime version and fingerprint.

        The runtime version — which follows the app version's major and minor — has
        changed, and nothing tells this workflow what the new version is for. **Create the
        release and the next merge builds it.**

        1. Create a GitHub release tagged `${{ needs.release_state.outputs.runtime_version }}`,
           marked **draft or pre-release**.
        2. Push to `main` again. With a pre-release and no matching builds, this workflow
           builds iOS and Android and submits them to App Store Connect and Google Play.
           Later merges repack and resubmit iOS, and rebuild and resubmit Android.
        3. Clear both release flags once the version is live, so later merges publish
           over-the-air updates instead.

  doc_release_missing_for_match:
    name: Explain missing release for matching build
    needs: [ios_get_build, android_get_build, release_state]
    if: ${{ needs.ios_get_build.outputs.build_id && needs.android_get_build.outputs.build_id && needs.release_state.outputs.release_state == 'none' }}
    type: doc
    params:
      md: |
        # Fingerprint matches, but no release says what to do with it

        `main` at commit `${{ github.sha }}` matches the production store builds for runtime
        version **${{ needs.release_state.outputs.runtime_version }}**
        (iOS `${{ needs.ios_get_build.outputs.build_id }}`, Android
        `${{ needs.android_get_build.outputs.build_id }}`), but no GitHub release is tagged
        for that version.

        The release's state is what decides between replacing the store builds and
        publishing an update, so there is nothing to decide from. Create a GitHub release
        tagged `${{ needs.release_state.outputs.runtime_version }}`:

        - **Draft or pre-release** while the version is still being assembled — merges
          replace and resubmit the store builds.
        - **Full release** (neither flag) once the version is live — merges publish an
          update to production.

  fail_workflow:
    name: Fail
    needs: [ios_get_build, android_get_build, release_state]
    after:
      [doc_fingerprint_mismatch, doc_no_release, doc_release_missing_for_match]
    # Everything except the lanes that ship: a pre-release (either lane), and an
    # update when both platforms match.
    if: ${{ needs.release_state.outputs.release_state == 'none' || (!(needs.ios_get_build.outputs.build_id && needs.android_get_build.outputs.build_id) && needs.release_state.outputs.release_state == 'released') }}
    steps:
      - name: Fail the run
        run: |
          echo "Nothing can ship from this merge. See the note above."
          exit 1
