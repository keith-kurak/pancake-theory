name: Build or Repack, then agent-device

# The agent-device counterpart of build-or-repack-then-maestro.yaml.
#
# Same front half: fingerprint the commit, reuse a matching preview simulator
# build by repacking it, or build one when nothing matches. The back half swaps
# the `maestro` job type for a custom macOS job that boots a simulator itself
# and runs e2e/agent-device/make-fluffy-pancakes.sh — a fixed sequence of
# agent-device commands, not an agent choosing steps at run time.
#
# iOS only. Android would be the same job on
# `runs_on: linux-medium-nested-virtualization` with an emulator and the APK.

jobs:
  fingerprint:
    # The e2e profiles extend production, so this needs the production
    # environment for ANDROID_MINIFY. Nothing else: the e2e profiles are
    # fingerprint-identical to production by design.
    environment: production
    type: fingerprint

  ios_get_build:
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      platform: ios
      profile: e2e-simulator

  ios_repack:
    needs: [ios_get_build]
    if: ${{ needs.ios_get_build.outputs.build_id }}
    type: repack
    env:
      METRICS_ENV: e2e
    params:
      build_id: ${{ needs.ios_get_build.outputs.build_id }}

  ios_build:
    needs: [ios_get_build]
    if: ${{ !needs.ios_get_build.outputs.build_id }}
    type: build
    env:
      METRICS_ENV: e2e
    params:
      platform: ios
      profile: e2e-simulator

  # `after` rather than `needs`: exactly one of repack/build runs and the other
  # is skipped, and `needs` on a skipped job would skip this too.
  ios_agent_device:
    name: agent-device e2e
    after: [ios_repack, ios_build]
    runs_on: macos-medium
    # The e2e profile lives on the production environment; keep the runner there
    # too so nothing here implies a preview build.
    environment: production
    env:
      E2E_APP_ID: com.keithkurak.pancaketheory
      E2E_PLATFORM: ios
      # No E2E_DEVICE: the script picks the newest iPhone simulator the runner
      # actually has. A hardcoded name fails with DEVICE_NOT_FOUND, because the
      # macos-medium image carries a different set from the Maestro image.
      E2E_ARTIFACTS: agent-out/e2e
    steps:
      - uses: eas/checkout

      - name: Install agent-device
        # Pinned: the runner drives a real simulator, so a surprise CLI upgrade
        # mid-week is a test failure nobody changed anything to cause.
        run: npm install --global agent-device@0.20.10

      - id: download_build
        uses: eas/download_build
        with:
          build_id: ${{ needs.ios_repack.outputs.build_id || needs.ios_build.outputs.build_id }}
          extensions: [app]

      - name: Run the deterministic flow
        run: ./e2e/agent-device/make-fluffy-pancakes.sh "${{ steps.download_build.outputs.artifact_path }}"

      # Screenshots are the evidence whether the run passed or failed, and the
      # failing case is the one worth looking at.
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          path: agent-out/e2e
