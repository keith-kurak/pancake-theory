name: Agent Start

# Label a draft PR whose description is the task with `agent-start`, and this
# workflow writes an implementation plan into the description, implements it,
# proves it runs on a simulator, and commits it.
# A passing run then goes to the shared verify function, an independent and
# adversarial check, and only its PASS flips the PR to ready. Pairs with
# agent-revise.yaml, which applies `/agent` review comments afterwards. See
# .eas/workflows/README.md for setup and behaviour.

on:
  pull_request_labeled:
    labels:
      - agent-start

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

defaults:
  tools:
    bun: 1.3.10

jobs:
  agent:
    name: Implement, validate, publish
    # Draft only: a PR already in review must not be rewritten under the
    # reviewer, so re-labelling one is a no-op. The runner re-checks this
    # against the API too.
    #
    # There is no fork check. EAS blocks fork PRs in its webhook handler, before
    # a run is ever dispatched — see the note in README.md.
    if: ${{ github.event.pull_request.draft }}
    # The simulator runs on EAS, not here, so this job needs no Mac and no
    # nested virtualisation. It only runs Metro, the eas CLI, and Claude.
    runs_on: linux-medium
    environment: development
    # Where the verifier starts reading `/agent` comments. In revise mode it
    # is the boundary the change requests were collected from, so the
    # verifier checks the same requests the agent applied.
    outputs:
      requests_since: ${{ steps.run.outputs.requests_since }}
    env:
      AGENT_MODE: build
      AGENT_LABEL: agent-start
      PR_NUMBER: ${{ github.event.pull_request.number }}
      # head.ref is not in the documented context type either; ref_name is, and
      # for a labelled PR it is the head branch. The runner falls back to the
      # API if both come through empty.
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
      # github.repository is optional in EAS's context and is empty for
      # pull_request_labeled, which fails env validation (values must be a
      # string or number). Same fallback idiom as update-on-pr.yaml.
      GH_REPO: ${{ github.repository || 'keith-kurak/pancake-theory' }}
      RUN_URL: ${{ workflow.url }}
      AGENT_TOTAL_BUDGET_SECONDS: '1800'
      # The verify job below owns the ready/draft decision.
      AGENT_VERIFY_FOLLOWS: '1'
    steps:
      # The default checkout lands on a detached HEAD at the PR's recorded
      # commit. `ref` puts us on the branch itself, which is what the run needs
      # in order to push its commit back to the PR.
      - uses: eas/checkout
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - uses: eas/install_node_modules

      # Both must be on PATH before the runner starts: it invokes `claude`
      # directly, and remote-sim.sh needs `argent` (whose `argent link` must be
      # the same install the MCP server later reads). npm rather than bun here:
      # global binary installs are the one case npm links more reliably on a CI
      # worker. Project dependencies still come from bun.
      - name: Install argent and Claude Code
        run: npm install --global @swmansion/argent@latest @anthropic-ai/claude-code@latest

      # The PR description is user-written text. It is not interpolated into
      # this file — the script reads it through the GitHub API and hands it to
      # Claude as a file, so it cannot reach the shell as code.
      - id: run
        name: Run agent
        run: ./scripts/agent/run-agent-pr.sh

      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: agent-run
          path: |
            agent-out/**/*

  # The independent check. `needs`, so it runs only when the agent's own
  # validation passed: a failing run already reports its blockers and its
  # screenshots, and verifying code the agent itself rejected spends a
  # simulator session to learn nothing new.
  #
  # A custom job, not the pre-packaged fingerprint/update jobs agent-verify.yaml
  # uses. Those always use the commit that triggered the workflow, which is the
  # commit before the agent pushed. This checkout takes the branch head.
  verify:
    name: Verify independently
    needs: [agent]
    runs_on: linux-medium
    environment: development
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
      GH_REPO: ${{ github.repository || 'keith-kurak/pancake-theory' }}
      RUN_URL: ${{ workflow.url }}
    steps:
      - uses: eas/checkout
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      # gate_ready: the agent job left the PR's draft state alone, so this
      # verdict alone decides it. The PR is flipped once, not twice.
      - uses: ./.eas/functions/agent-verify
        with:
          requests_since: ${{ needs.agent.outputs.requests_since }}
          gate_ready: true
