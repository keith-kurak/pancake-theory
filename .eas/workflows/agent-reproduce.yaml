name: Agent Reproduce

# Try to reproduce a bug report on an iOS cloud simulator, and post the verdict
# on the issue: REPRODUCED, NOT_REPRODUCED, or INCONCLUSIVE, with links to a
# screenshot evidence page and the simulator session.
#
# Started by .github/workflows/agent-reproduce-from-issue.yml when the
# `agent-reproduce` label is applied to an issue. EAS has no issue trigger, so
# that Action checks the labeller's access and starts this run with
# `eas workflow:run --ref <default branch>` and exits. Everything else,
# including every comment on the issue, happens here.
#
# The app under test is the default branch: the fingerprint and build jobs use
# the commit the run was started on. To steer an attempt, comment
# `/agent <what to try>` on the issue first. Writes no code and pushes no
# commits. See .eas/workflows/README.md.

on:
  workflow_dispatch:
    inputs:
      issue_number:
        type: number
        required: true
        description: The issue to reproduce.

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ inputs.issue_number }}

defaults:
  tools:
    bun: 1.3.10

jobs:
  # First, and with no dependencies, so the issue hears about the run before
  # a native build that can take twenty minutes.
  announce:
    name: Comment that the run started
    environment: development # GH_TOKEN
    env:
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      GH_REPO: ${{ github.repository || 'keith-kurak/pancake-theory' }}
      RUN_URL: ${{ workflow.url }}
    steps:
      - uses: eas/checkout
      - name: Comment on the issue
        run: ./scripts/agent/reproduce-issue.sh --announce

  # Same build resolution as agent-verify.yaml: a native change on the default
  # branch gets a fresh simulator build instead of an INCONCLUSIVE verdict.
  fingerprint:
    environment: development
    type: fingerprint

  get_build:
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      platform: ios
      profile: development-simulator

  build:
    needs: [get_build]
    if: ${{ !needs.get_build.outputs.build_id }}
    name: Build a matching simulator client
    type: build
    params:
      platform: ios
      profile: development-simulator

  reproduce:
    name: Reproduce on a cloud simulator
    after: [get_build, build]
    # The simulator runs on EAS, so this job only needs the eas CLI, argent,
    # and Claude.
    runs_on: linux-medium
    environment: development
    outputs:
      verdict: ${{ steps.reproduce.outputs.verdict }}
      evidence_url: ${{ steps.reproduce.outputs.evidence_url }}
      session_url: ${{ steps.reproduce.outputs.session_url }}
    env:
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      # github.repository can be empty outside push events. Same fallback idiom
      # as the other agent workflows.
      GH_REPO: ${{ github.repository || 'keith-kurak/pancake-theory' }}
      RUN_URL: ${{ workflow.url }}
    steps:
      - uses: eas/checkout

      - uses: eas/install_node_modules

      # Both must be on PATH before the script starts. npm rather than bun:
      # global binary installs are the one case npm links more reliably on a
      # CI worker. Project dependencies still come from bun.
      - name: Install argent and Claude Code
        run: npm install --global @swmansion/argent@latest @anthropic-ai/claude-code@latest

      # Only a build id reaches this command line. The issue text is fetched by
      # the script through the API and handed to Claude as a file.
      - id: reproduce
        name: Reproduce
        run: |
          export REPRO_BUILD_ID='${{ needs.get_build.outputs.build_id || needs.build.outputs.build_id }}'
          ./scripts/agent/reproduce-issue.sh

      # The evidence site is the maintainer-facing artifact. Keep the raw
      # transcript and the reporter's images attached to the run too.
      # `evidence/site` is excluded because it is already on EAS Hosting.
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: reproduction
          path: |
            evidence/*.png
            evidence/*.jpg
            evidence/*.mp4
            evidence/*.md
            evidence/*.txt
            evidence/*.json
            evidence/*.jsonl
            evidence/*.log
            evidence/issue/*

  # Last, and `after` rather than `needs`, so the label comes off whether the
  # jobs above passed, failed, or were skipped. Applying it again then starts a
  # new run. The PR-label function works on issues unchanged: GitHub serves
  # both from the same labels endpoint.
  remove_label:
    name: Remove the agent-reproduce label
    after: [reproduce]
    environment: development # GH_TOKEN
    steps:
      - uses: eas/checkout
      - uses: ./.eas/functions/remove-pr-label
        with:
          label: agent-reproduce
          pr_number: ${{ inputs.issue_number }}
