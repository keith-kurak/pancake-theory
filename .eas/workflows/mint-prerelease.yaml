name: Mint a pre-release for a new app version

# Manual only. Starts a new version's release cycle: sets the app version in
# app.json on main, then creates the GitHub release tagged with the runtime
# version, flagged pre-release, on that commit. See RELEASE.md for where this
# fits.
#
# The runtime version is major.minor.0 of the version input, the same rule as
# app.config.js. With a pre-release in place, deploy-production-on-main.yaml
# builds and submits both platforms on each merge, until
# promote-release-on-distribution.yaml makes it a full release.
#
#   npx eas-cli@latest workflow:run .eas/workflows/mint-prerelease.yaml \
#     --ref main -F version=1.6.0
#
# The version bump is committed straight to main with "[eas skip]", so it does
# not start a deploy. If main already has the version (bumped in a PR), there is
# no commit, and the release is tagged on the head of main.
#
# It refuses a version older than main's, and refuses to touch an existing
# release for the runtime version, draft, pre-release, or full. Needs the
# production environment's GITHUB_TOKEN with WRITE access to contents and releases.

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
        description: The new app version, for example 1.6.0

concurrency:
  cancel_in_progress: false
  group: ${{ workflow.filename }}

defaults:
  tools:
    bun: 1.3.10

jobs:
  mint:
    name: Mint the pre-release
    environment: production
    outputs:
      runtime_version: ${{ steps.resolve.outputs.runtime_version }}
      sha: ${{ steps.bump.outputs.sha }}
      previous_version: ${{ steps.bump.outputs.previous_version }}
      url: ${{ steps.create.outputs.url }}
    steps:
      # For the local functions. The commit to tag comes from bump, not this
      # checkout.
      - uses: eas/checkout

      - id: resolve
        name: Resolve the runtime version
        run: |
          set -euo pipefail
          VERSION='${{ inputs.version }}'
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The version must be major.minor.patch, for example 1.6.0. Got: $VERSION"
            exit 1
          fi
          IFS=. read -r MAJOR MINOR _ <<< "$VERSION"
          RV="$MAJOR.$MINOR.0"
          echo "App version $VERSION has runtime version $RV."
          set-output runtime_version "$RV"

      - id: release
        uses: ./.eas/functions/find-github-release
        with:
          runtime_version: ${{ steps.resolve.outputs.runtime_version }}

      - id: check
        name: Check that the runtime version has no release yet
        run: |
          set -euo pipefail
          RV='${{ steps.resolve.outputs.runtime_version }}'
          STATE='${{ steps.release.outputs.state }}'
          if [ "$STATE" != "none" ]; then
            echo "Runtime version $RV already has a release ($STATE):"
            echo "${{ steps.release.outputs.url }}"
            echo "To start a new version, bump the major or minor."
            exit 1
          fi

      - id: bump
        uses: ./.eas/functions/bump-app-version
        with:
          version: ${{ inputs.version }}

      - id: create
        uses: ./.eas/functions/create-github-release
        with:
          tag: ${{ steps.resolve.outputs.runtime_version }}
          target_commitish: ${{ steps.bump.outputs.sha }}
          prerelease: true
          body: |
            Pre-release for runtime version ${{ steps.resolve.outputs.runtime_version }}.
            While this release is a pre-release, each merge to `main` builds the store binaries and submits them. It becomes a full release when App Store Connect reports the version ready for distribution. See RELEASE.md.

  summary:
    name: Summary
    needs: [mint]
    type: doc
    params:
      md: |
        # Minted ${{ needs.mint.outputs.runtime_version }} as a pre-release

        The app version on `main` is `${{ inputs.version }}` (was
        `${{ needs.mint.outputs.previous_version }}`). The release is tagged
        `${{ needs.mint.outputs.runtime_version }}` on `${{ needs.mint.outputs.sha }}`.

        The version bump does not start a deploy. The next push to `main` builds iOS
        and Android and submits them. To build now without a push, run:

        ```
        npx eas-cli@latest workflow:run .eas/workflows/deploy-production-on-main.yaml --ref main
        ```

        Release: ${{ needs.mint.outputs.url }}
