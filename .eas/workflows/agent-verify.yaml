name: Agent Verify

# Ask for a PR to be proven on a real device by commenting `/verify <optional
# guidance>`, then applying the `agent-verify` label.
#
# EAS Workflows has no comment trigger, so the comment carries the guidance and
# the label starts the run. The job removes the label when it finishes.
#
# Unlike agent-start and agent-revise, this writes no code and pushes no
# commits. It answers "does this PR work?" and reports, so it is safe to run
# against a PR a human wrote.
#
# See .eas/workflows/README.md.

on:
  pull_request_labeled:
    labels:
      - agent-verify

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

defaults:
  tools:
    bun: 1.3.10

jobs:
  # The binary and the JS are resolved separately, which is the point: a
  # fingerprint-matched development build is reused across PRs, and only the
  # JavaScript changes per run.
  fingerprint:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    environment: development
    type: fingerprint

  get_build:
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      platform: ios
      profile: development-simulator

  # Only when no build matches this fingerprint. Native changes make the run
  # long rather than making it lie.
  build:
    needs: [get_build]
    if: ${{ !needs.get_build.outputs.build_id }}
    name: Build a matching simulator client
    type: build
    params:
      platform: ios
      profile: development-simulator

  # Publishes this PR's JS to a branch named after the PR branch. The verify
  # job deep-links the build at this exact update group, so the shared preview
  # channel is never touched.
  publish_update:
    needs: [fingerprint]
    name: Publish this PR's JS
    environment: development
    type: update
    env:
      APP_VARIANT: DEV
    params:
      branch: ${{ github.event.pull_request.head.ref }}
      message: 'Verify PR #${{ github.event.pull_request.number }}'

  verify:
    name: Verify on a cloud simulator
    after: [get_build, build, publish_update]
    # The simulator runs on EAS, so this job only needs the eas CLI, argent,
    # and Claude.
    runs_on: linux-medium
    environment: development
    env:
      BUILD_ID: ${{ needs.get_build.outputs.build_id || needs.build.outputs.build_id }}
      UPDATE_GROUP_ID: ${{ needs.publish_update.outputs.first_update_group_id }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ workflow.url }}
      VERIFY_LABEL: agent-verify
    steps:
      - uses: eas/checkout
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: eas/install_node_modules

      # The verify script reads the /verify comment through the API and filters
      # it by author_association, so comment text never reaches this file or a
      # shell command.
      - name: Verify
        run: ./scripts/agent/verify-pr.sh

      # The evidence site is the reviewer-facing artifact, but keep the raw
      # transcript and diff attached to the run too. `evidence/site` is excluded
      # because it is already deployed to EAS Hosting.
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: verification
          path: |
            evidence/*.png
            evidence/*.md
            evidence/*.txt
            evidence/*.jsonl
