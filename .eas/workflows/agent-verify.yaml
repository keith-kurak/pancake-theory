name: Agent Verify

# Ask for a PR to be proven on a real device by applying the `agent-verify`
# label. To steer the verifier, first comment `/agent <what to check>`.
#
# Every agent instruction is an `/agent` comment. The label decides what
# happens with it: `agent-revise` applies it as a change, `agent-verify` uses it
# as the focus of a check. The job removes the label when it finishes.
#
# Unlike agent-start and agent-revise, this writes no code and pushes no
# commits. It answers "does this PR work?" and reports, so it is safe to run
# against a PR a human wrote. Those two workflows also end by calling the same
# verify function, so a passing agent run is always checked by this verifier.
#
# See .eas/workflows/README.md.

on:
  pull_request_labeled:
    labels:
      - agent-verify

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

defaults:
  tools:
    bun: 1.3.10

jobs:
  # The binary is resolved here, not inside the verify function, so that a
  # native change gets a fresh build instead of an INCONCLUSIVE verdict. That
  # is safe in this workflow only: nothing pushes during it, so the triggering
  # commit these pre-packaged jobs use is the commit under test.
  fingerprint:
    environment: development
    type: fingerprint

  get_build:
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      platform: ios
      profile: development-simulator

  # Only when no build matches this fingerprint. Native changes make the run
  # long rather than making it lie.
  build:
    needs: [get_build]
    if: ${{ !needs.get_build.outputs.build_id }}
    name: Build a matching simulator client
    type: build
    params:
      platform: ios
      profile: development-simulator

  verify:
    name: Verify on a cloud simulator
    after: [get_build, build]
    # The simulator runs on EAS, so this job only needs the eas CLI, argent,
    # and Claude.
    runs_on: linux-medium
    environment: development
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
      # github.repository is optional in EAS's context and is empty for
      # pull_request_labeled, which fails env validation (values must be a
      # string or number). Same fallback idiom as update-on-pr.yaml.
      GH_REPO: ${{ github.repository || 'keith-kurak/pancake-theory' }}
      RUN_URL: ${{ workflow.url }}
    steps:
      - uses: eas/checkout
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - uses: ./.eas/functions/agent-verify
        with:
          build_id: ${{ needs.get_build.outputs.build_id || needs.build.outputs.build_id }}
          label: agent-verify
