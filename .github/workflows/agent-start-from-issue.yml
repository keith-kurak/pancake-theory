name: Agent Start from Issue

# Turn an issue into a draft PR that the EAS agent workflows pick up.
#
# This is the one piece that cannot live in EAS Workflows: EAS has no comment
# trigger and no issue trigger at all. GitHub Actions has both, so it does the
# small mechanical job — branch, PR-TODO.md, draft PR, label — and everything
# after that runs on EAS.
#
# Two ways in:
#   - comment `/build <optional extra guidance>` on an issue
#   - apply the `agent-start` label to an issue
#
# Either way the run is refused unless the actor has write access. See the
# authorise step.

on:
  issue_comment:
    types: [created]
  issues:
    types: [labeled]

concurrency:
  # One PR per issue, even if the label and a comment land together.
  group: agent-start-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  create_pr:
    name: Create a draft PR from the issue
    runs-on: ubuntu-latest
    # `issue_comment` also fires for comments on pull requests, so the
    # pull_request field must be null for this to be a real issue.
    if: >-
      (github.event_name == 'issue_comment' &&
       !github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/build')) ||
      (github.event_name == 'issues' &&
       github.event.label.name == 'agent-start')
    steps:
      # ---------------------------------------------------------------------
      # Authorisation. Everything else depends on this passing.
      # ---------------------------------------------------------------------
      #
      # On a PUBLIC repository this endpoint returns "read" for any GitHub user
      # — including total strangers — rather than 404. Checking that the call
      # succeeded would therefore authorise everyone. The permission *value* is
      # what matters.
      #
      # author_association is deliberately not used: it reports MEMBER only when
      # org membership is public, so it silently under-reports on private teams.
      - name: Authorise the actor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.event_name == 'issue_comment' && github.event.comment.user.login || github.actor }}
        run: |
          set -euo pipefail
          PERMISSION="$(gh api \
            "repos/${{ github.repository }}/collaborators/${ACTOR}/permission" \
            --jq '.permission' 2>/dev/null || true)"

          # Match on the value, and only on values we recognise, so an error
          # body or an empty response falls through to the refusal.
          case "$PERMISSION" in
            admin|maintain|write)
              echo "$ACTOR has '$PERMISSION' on ${{ github.repository }}"
              ;;
            *)
              echo "::error::$ACTOR does not have write access on ${{ github.repository }}; refusing to start an agent run."
              exit 1
              ;;
          esac

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          # The PAT, not GITHUB_TOKEN, so the push and the PR carry a real
          # author. See the note on AGENT_GH_TOKEN below.
          token: ${{ secrets.AGENT_GH_TOKEN }}
          fetch-depth: 0

      - name: Build the task file
        id: task
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event_name == 'issue_comment' && github.event.comment.body || '' }}
        run: |
          set -euo pipefail

          # Issue text is untrusted and is never interpolated into a shell
          # command — it reaches the file through the environment only.
          python3 - <<'PY'
          import os, pathlib, re

          title = os.environ["ISSUE_TITLE"].strip()
          body = (os.environ["ISSUE_BODY"] or "").strip()
          number = os.environ["ISSUE_NUMBER"]
          url = os.environ["ISSUE_URL"]

          # Anything after "/build" on the comment is extra steer for the agent.
          comment = (os.environ.get("COMMENT_BODY") or "").strip()
          guidance = ""
          if comment.startswith("/build"):
              guidance = comment[len("/build"):].strip()

          parts = [
              f"# {title}",
              "",
              "## What to build",
              "",
              body or "_The issue had no description. Use the title._",
              "",
          ]
          if guidance:
              parts += ["## Extra guidance from the request", "", guidance, ""]
          parts += [
              "## Source",
              "",
              f"Opened from issue #{number} — {url}",
              "",
              "_Generated by `.github/workflows/agent-start-from-issue.yml`._",
              "",
          ]
          pathlib.Path("PR-TODO.md").write_text("\n".join(parts), encoding="utf-8")

          slug = re.sub(r"[^a-z0-9]+", "-", title.lower()).strip("-")[:40] or "task"

          # A newline in a value would let the rest of the title be read as a
          # second output line, so collapse whitespace before writing.
          flat_title = " ".join(title.split())[:120]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"branch=agent/issue-{number}-{slug}\n")
              out.write(f"title=Agent: {flat_title}\n")
          PY

          echo "--- PR-TODO.md ---"
          cat PR-TODO.md

      - name: Push the branch
        id: push
        env:
          BRANCH: ${{ steps.task.outputs.branch }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          git config user.name  "eas-agent[bot]"
          git config user.email "eas-agent[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::notice::$BRANCH already exists; reusing it."
            echo "existed=true" >> "$GITHUB_OUTPUT"
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
          else
            echo "existed=false" >> "$GITHUB_OUTPUT"
            git checkout -b "$BRANCH"
          fi

          git add PR-TODO.md
          if git diff --cached --quiet; then
            echo "::notice::PR-TODO.md is unchanged; nothing to push."
          else
            git commit -m "Add PR-TODO.md for issue #${ISSUE_NUMBER}"
            git push origin "$BRANCH"
          fi

      # The PR is created WITHOUT the label, and the label is applied in the
      # next step. Creating a PR with labels attached emits `opened` with the
      # labels already set and no separate `labeled` event, so EAS would never
      # see the trigger it listens for.
      - name: Open the draft PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN }}
          BRANCH: ${{ steps.task.outputs.branch }}
          TITLE: ${{ steps.task.outputs.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          EXISTING="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' || echo "")"
          if [ -n "$EXISTING" ]; then
            echo "::notice::PR #$EXISTING already open for $BRANCH."
            echo "number=$EXISTING" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BODY="$(printf "Closes #%s\n\nThe task is in \`PR-TODO.md\`. The EAS **Agent Start** workflow builds it and reports back here.\n" "$ISSUE_NUMBER")"

          URL="$(gh pr create \
            --draft \
            --base "$BASE" \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body "$BODY")"
          echo "Created $URL"
          echo "number=$(basename "$URL")" >> "$GITHUB_OUTPUT"

      # This label is what actually starts the EAS run.
      - name: Label the PR to start the EAS run
        env:
          GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          gh pr edit "$PR_NUMBER" --add-label agent-start

      - name: Link the PR from the issue
        env:
          GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" \
            --body "Started an agent run in #${PR_NUMBER}. Results will be posted on that PR."
