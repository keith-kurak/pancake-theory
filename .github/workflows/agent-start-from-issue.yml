name: Agent Start from Issue

# Turn an issue into a draft PR that the EAS agent workflows pick up.
#
# This is the one piece that cannot live in EAS Workflows: EAS has no issue
# trigger at all (its comment trigger covers pull requests only). GitHub Actions
# has one, so it does the small mechanical job — branch, draft PR with the task
# as its description, label — and everything after that runs on EAS.
#
# Apply the `agent-start` label to an issue. To steer the build, first comment
# `/agent <extra guidance>` on the issue; every such comment from a trusted
# author is added to the PR description.
#
# Every agent instruction, on issues and PRs alike, is an `/agent` comment. The
# label decides what is done with it, so there is one command to remember.
#
# The run is refused unless the labeller has write access. See the authorise
# step.

on:
  issues:
    types: [labeled]

concurrency:
  # One PR per issue, even if the label is removed and re-applied quickly.
  group: agent-start-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  # Reading the issue's `/agent` comments.
  issues: read

jobs:
  create_pr:
    name: Create a draft PR from the issue
    runs-on: ubuntu-latest
    if: github.event.label.name == 'agent-start'
    steps:
      # ---------------------------------------------------------------------
      # Authorisation. Everything else depends on this passing.
      # ---------------------------------------------------------------------
      #
      # On a PUBLIC repository this endpoint returns "read" for any GitHub user
      # — including total strangers — rather than 404. Checking that the call
      # succeeded would therefore authorise everyone. The permission *value* is
      # what matters.
      #
      # author_association is deliberately not used: it reports MEMBER only when
      # org membership is public, so it silently under-reports on private teams.
      - name: Authorise the actor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          PERMISSION="$(gh api \
            "repos/${{ github.repository }}/collaborators/${ACTOR}/permission" \
            --jq '.permission' 2>/dev/null || true)"

          # Match on the value, and only on values we recognise, so an error
          # body or an empty response falls through to the refusal.
          case "$PERMISSION" in
            admin|maintain|write)
              echo "$ACTOR has '$PERMISSION' on ${{ github.repository }}"
              ;;
            *)
              echo "::error::$ACTOR does not have write access on ${{ github.repository }}; refusing to start an agent run."
              exit 1
              ;;
          esac

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          # The PAT, not GITHUB_TOKEN, so the push and the PR carry a real
          # author. See the note on AGENT_GH_TOKEN below.
          token: ${{ secrets.AGENT_GH_TOKEN }}
          fetch-depth: 0

      # Same filter as the EAS runners' gh_collect_requests: the `/agent`
      # prefix, and an OWNER, MEMBER, or COLLABORATOR author. The repository is
      # public, so without the second filter a stranger's comment would become
      # agent instructions. Written to a file, never to the shell.
      #
      # author_association under-reports private org members (see the
      # authorise step). Here that fails safe: such a comment is dropped as
      # guidance, it is never trusted by mistake.
      - name: Collect /agent comments from the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          gh api --paginate \
            "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
            --jq '.[] | select(.author_association == "OWNER" or .author_association == "MEMBER" or .author_association == "COLLABORATOR")
                      | select(.body | test("^\\s*/agent"))
                      | {user: .user.login, body: .body}' \
            > "$RUNNER_TEMP/guidance.jsonl" || : > "$RUNNER_TEMP/guidance.jsonl"
          echo "Found $(wc -l < "$RUNNER_TEMP/guidance.jsonl") /agent comment(s)"

      # An open PR for this issue already holds the task in its description,
      # and agent runs have written their plan and results into it. Leave both
      # alone and only label it again. To change the task, edit the PR
      # description or comment `/agent` on the PR.
      - name: Find an existing PR
        id: existing
        env:
          GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          NUMBER="$(gh pr list --state open --limit 200 \
            --json number,headRefName \
            --jq "[.[] | select(.headRefName | startswith(\"agent/issue-${ISSUE_NUMBER}-\"))][0].number // empty" \
            || echo "")"
          if [ -n "$NUMBER" ]; then
            echo "::notice::PR #$NUMBER is already open for issue #$ISSUE_NUMBER; labelling it again."
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Build the PR description
        id: task
        if: steps.existing.outputs.number == ''
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          # Issue text is untrusted and is never interpolated into a shell
          # command — it reaches the file through the environment only.
          python3 - <<'PY'
          import json, os, pathlib, re

          title = os.environ["ISSUE_TITLE"].strip()
          body = (os.environ["ISSUE_BODY"] or "").strip()
          number = os.environ["ISSUE_NUMBER"]
          url = os.environ["ISSUE_URL"]

          # Anything after "/agent" on a trusted comment is extra steer, oldest
          # first, the same order the revise run applies requests in.
          guidance = []
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "guidance.jsonl"
          for line in path.read_text(encoding="utf-8").splitlines():
              if not line.strip():
                  continue
              c = json.loads(line)
              text = c["body"].lstrip()[len("/agent"):].strip()
              if text:
                  guidance.append(f"- @{c['user']}: {text}")

          # The PR description is the task. Agent runs add their own marked
          # blocks below it and never edit this part, so it stays the task.
          parts = [
              f"Closes #{number}",
              "",
              "## What to build",
              "",
              body or f"_The issue had no description. Use the title: {title}_",
              "",
          ]
          if guidance:
              parts += ["## Extra guidance from `/agent` comments", "", *guidance, ""]
          parts += [
              f"_Opened from {url} by `.github/workflows/agent-start-from-issue.yml`. "
              "The EAS **Agent Start** workflow builds this description and reports back here._",
              "",
          ]
          pathlib.Path(os.environ["RUNNER_TEMP"], "pr-body.md").write_text(
              "\n".join(parts), encoding="utf-8")

          slug = re.sub(r"[^a-z0-9]+", "-", title.lower()).strip("-")[:40] or "task"

          # A newline in a value would let the rest of the title be read as a
          # second output line, so collapse whitespace before writing.
          flat_title = " ".join(title.split())[:120]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"branch=agent/issue-{number}-{slug}\n")
              out.write(f"title=Agent: {flat_title}\n")
          PY

          echo "--- PR description ---"
          cat "$RUNNER_TEMP/pr-body.md"

      # GitHub will not open a PR with no diff, so the branch carries one
      # placeholder file. The agent run deletes it in the same commit as the
      # real change, so it never reaches main. The task is not in this file.
      - name: Push the branch
        if: steps.existing.outputs.number == ''
        env:
          BRANCH: ${{ steps.task.outputs.branch }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          git config user.name  "eas-agent[bot]"
          git config user.email "eas-agent[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::notice::$BRANCH already exists; reusing it."
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi

          printf 'Placeholder so GitHub can open the PR for issue #%s. The agent run deletes it; the task is in the PR description.\n' \
            "$ISSUE_NUMBER" > .agent-placeholder
          git add .agent-placeholder
          if git diff --cached --quiet; then
            echo "::notice::The placeholder is unchanged; nothing to push."
          else
            git commit -m "Open agent PR for issue #${ISSUE_NUMBER}"
            git push origin "$BRANCH"
          fi

      # The PR is created WITHOUT the label, and the label is applied in the
      # next step. Creating a PR with labels attached emits `opened` with the
      # labels already set and no separate `labeled` event, so EAS would never
      # see the trigger it listens for.
      - name: Open the draft PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN }}
          EXISTING: ${{ steps.existing.outputs.number }}
          BRANCH: ${{ steps.task.outputs.branch }}
          TITLE: ${{ steps.task.outputs.title }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ -n "$EXISTING" ]; then
            echo "number=$EXISTING" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          URL="$(gh pr create \
            --draft \
            --base "$BASE" \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body-file "$RUNNER_TEMP/pr-body.md")"
          echo "Created $URL"
          echo "number=$(basename "$URL")" >> "$GITHUB_OUTPUT"

      # This label is what actually starts the EAS run.
      - name: Label the PR to start the EAS run
        env:
          GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          gh pr edit "$PR_NUMBER" --add-label agent-start

      - name: Link the PR from the issue
        env:
          GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          # Same marker the EAS runners apply, for the same reason: until a
          # machine user owns the token, this comment is authored by a person.
          BODY="$(printf '> 🤖 **Automated** — written by the agent workflow, not by a human. · [view run](%s/actions/runs/%s)\n\nStarted an agent run in #%s. Results will be posted on that PR.\n' \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$PR_NUMBER")"
          gh issue comment "$ISSUE_NUMBER" --body "$BODY"
